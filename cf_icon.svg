<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Protected clipboard icon">
  <rect width="128" height="128" fill="none"/>

  <!-- Clipboard -->
  <rect x="28" y="20" width="72" height="92" rx="12" fill="#8b5a2b"/>
  <rect x="44" y="10" width="40" height="22" rx="10" fill="#a4713a"/>

  <!-- Shield -->
  <path d="M64 56
           C76 56 86 51 92 47
           V70
           C92 86 81 100 64 108
           C47 100 36 86 36 70
           V47
           C42 51 52 56 64 56Z"
        fill="#2563eb"/>

  <!-- Prompt ">" (green) -->
  <path d="M52 70 L62 78 L52 86"
        fill="none" stroke="#22c55e" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Checkmark (light grey) -->
